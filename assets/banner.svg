<svg width="1000" height="220" viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134E5E">
        <animate attributeName="stop-color" values="#134E5E;#186270;#134E5E" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#71B280">
        <animate attributeName="stop-color" values="#71B280;#84c491;#71B280" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>

  <g transform="translate(70,180)" filter="url(#glow)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#d4f0dc" stroke-width="1.5" opacity="0.5"/>
    <rect x="0" y="-20" width="16" height="20" rx="2" fill="#d4f0dc">
      <animate attributeName="height" values="20;40;20" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-20;-40;-20" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="24" y="-45" width="16" height="45" rx="2" fill="#ffffff">
      <animate attributeName="height" values="45;65;45" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-45;-65;-45" dur="2.6s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="-30" width="16" height="30" rx="2" fill="#d4f0dc">
      <animate attributeName="height" values="30;55;30" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-30;-55;-30" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="72" y="-60" width="16" height="60" rx="2" fill="#ffffff">
      <animate attributeName="height" values="60;80;60" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="-60;-80;-60" dur="2.6s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M 260 150 L 280 110" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 268 112 L 280 110 L 282 122" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/>
  </path>

  <text x="330" y="95" font-family="Fira Code, monospace" font-size="30" font-weight="700" fill="#ffffff">E-Commerce Sales Analysis</text>
  <text x="330" y="130" font-family="Fira Code, monospace" font-size="16" fill="#d4f0dc">SQL + Python · 12,000 Orders Analyzed</text>
  <rect x="330" y="145" width="0" height="3" rx="1.5" fill="#d4f0dc">
    <animate attributeName="width" values="0;300;300" dur="1.4s" fill="freeze"/>
  </rect>
</svg>
